<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Outer Border Subtle Glow -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.5" />
    </linearGradient>

    <!-- Top Ribbon: Sponsorship Inflow (Indigo / Violet) -->
    <linearGradient id="topRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="40%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Spine Connector: Middle Bridge -->
    <linearGradient id="midSpine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Bottom Ribbon: Ledger Foot (Cyan / Sky) -->
    <linearGradient id="bottomRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Audit Checkmark (Vibrant Emerald / Mint) -->
    <linearGradient id="auditCheck" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
  </defs>

  <!-- Container Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="112" stroke="url(#borderGlow)" stroke-width="6" />

  <!-- Background Ledger Binder Spine (Left Accent) -->
  <rect x="88" y="112" width="12" height="288" rx="6" fill="#334155" opacity="0.45" />
  <circle cx="94" cy="156" r="4.5" fill="#F59E0B" />
  <circle cx="94" cy="256" r="4.5" fill="#F59E0B" />
  <circle cx="94" cy="356" r="4.5" fill="#F59E0B" />

  <!-- ============================================== -->
  <!-- SPONSORLEDGER GEOMETRIC MONOGRAM (S & L LEDGER) -->
  <!-- ============================================== -->

  <!-- Top Bar of 'S' (Top Ledger Cover) -->
  <path
    d="M 148 116
       L 348 116
       A 38 38 0 0 1 386 154
       L 386 182
       A 24 24 0 0 1 362 206
       L 236 206
       A 24 24 0 0 0 212 230
       L 212 236
       L 148 236
       A 24 24 0 0 1 124 212
       L 124 140
       A 24 24 0 0 1 148 116 Z"
    fill="url(#topRibbon)"
  />

  <!-- Right Interlocking Spine -->
  <rect x="338" y="156" width="48" height="110" rx="24" fill="url(#midSpine)" />

  <!-- Middle to Bottom Loop of 'S' and 'L' Base -->
  <path
    d="M 124 276
       L 268 276
       A 24 24 0 0 1 292 300
       L 292 306
       A 24 24 0 0 0 316 330
       L 364 330
       A 24 24 0 0 1 388 354
       L 388 372
       A 24 24 0 0 1 364 396
       L 148 396
       A 38 38 0 0 1 110 358
       L 110 290
       A 14 14 0 0 1 124 276 Z"
    fill="url(#bottomRibbon)"
  />

  <!-- Embedded Ledger Rule Lines inside Top & Bottom Folios -->
  <rect x="156" y="150" width="112" height="12" rx="6" fill="#FFFFFF" opacity="0.6" />
  <rect x="156" y="172" width="76" height="10" rx="5" fill="#FFFFFF" opacity="0.4" />
  <rect x="144" y="348" width="136" height="12" rx="6" fill="#FFFFFF" opacity="0.6" />
  <rect x="144" y="368" width="88" height="10" rx="5" fill="#FFFFFF" opacity="0.4" />

  <!-- Luminous Audit Verification Checkmark (Overlapping Center-Right) -->
  <path
    d="M 230 316
       L 280 366
       L 416 216"
    stroke="url(#auditCheck)"
    stroke-width="36"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Sparkling Verification Star (Top Right) -->
  <path
    d="M 406 82
       Q 406 106 430 106
       Q 406 106 406 130
       Q 406 106 382 106
       Q 406 106 406 82 Z"
    fill="#6EE7B7"
    opacity="0.95"
  />
  <circle cx="406" cy="106" r="4.5" fill="#FFFFFF" />
</svg>